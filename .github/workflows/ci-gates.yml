# The quality floor for Ringbolt, run on every pull request and every push to the default branch.
# It runs the SAME `npm run` scripts as the local pre-commit hook, so there is one source of truth
# and no drift between what passes here and what passes on a laptop.
#
# Deliberately lean, with no schedule: this repository is private, and private repositories are
# metered on Actions minutes. Public ones are not, so a schedule can be reconsidered after it goes
# public, but nothing here needs one.
name: gates
on:
  pull_request:
  push:
    branches: [main, master]
# Least privilege: `npm ci` executes third-party postinstall scripts, so the job's GITHUB_TOKEN
# must not carry write scopes. Nothing in this workflow writes to the repo.
permissions:
  contents: read
# One run per ref: rapid PR pushes cancel their stale runs (metered minutes on private repos);
# default-branch runs are never cancelled so main always gets a complete verdict.
concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      # SHA-pinned rather than tag-pinned: a tag is mutable, a commit SHA is not. The trailing
      # comment names the tag the SHA was verified against (git ls-remote) so a bump stays
      # reviewable. Update SHAs deliberately, never back to bare tags.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Matches engines.node in package.json, and both are set by wrangler, which declares
          # node >=22.0.0. Pinning 20 here made this workflow fail on its very first run: the
          # version worked on the machine it was written on and nowhere else, which is the whole
          # reason CI runs on a clean clone.
          node-version: 22
          cache: npm
      - run: npm ci
      # The accessibility gate drives a real browser against the built output. ubuntu-latest ships
      # Google Chrome at this path; a11y-live.mjs finds it there, and prints every path it looked in
      # and exits 2 if none of them exists, so a runner image that moves it fails loudly rather than
      # skipping the audit.
      - run: google-chrome --version
      # Build first so the size and accessibility gates have a bundle to read. `verify:ship` builds
      # again as one of its own steps, which is deliberate: this line keeps the client-secret step
      # below independent of what verify:ship happens to do, and a second vite build costs a second.
      - run: npm run build
      # Each gate is a FLOOR: green means no known violation, never "good". Taste and craft are not
      # gated here and cannot be, so do not read a green run as a review. Never make a gate pass by
      # suppressing it.
      #
      # verify:ship rather than gate: there is no separate test workflow, so this is the only place
      # CI runs the full surface (types, the whole suite, whole-repo lint, build, the gate chain,
      # then the live accessibility audit).
      - run: npm run verify:ship
      # The dashboard's bundle, scanned for a server-only key. It is pointed at dist/client
      # explicitly rather than left to auto-detect: this repo builds the Worker and the client from
      # one tree, and a gate that scanned all of `dist` would be reading server code, which is where
      # a secret is CORRECT.
      #
      # It is its own step rather than part of `npm run gate` because it needs a BUILT bundle, and
      # `gate` also runs in the pre-commit hook where none exists. There it would correctly report
      # UNKNOWN (exit 2) and fail every commit, and a gate that fails every commit gets deleted
      # within a day. Here the build step above always precedes it.
      #
      # If this ever exits 2 saying no bundle was found, the fix is the path, not the step: pass the
      # directory that actually holds the client build.
      - run: node scripts/vendor/check-client-secrets.mjs dist/client
